<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>ひとくち簿記</title>
<style>
:root{
  --bg:#f7f5f2; --card:#ffffff; --text:#484440; --muted:#817b75;
  --line:#e7e1da; --accent:#8d9b89;
  --asset:#dce8df; --liability:#eadde3; --equity:#e7e1cf; --revenue:#dce4ed; --expense:#eadfd4;
  --debit:#e5e0ef; --credit:#e6ddd4; --journal:#e3e8e0; --weak:#eee4dc;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:var(--bg);color:var(--text);
}
.wrap{max-width:680px;margin:auto;padding:24px 16px 40px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:800;font-size:22px}
.badge{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;
  box-shadow:0 8px 24px rgba(0,0,0,.04)
}
.hidden{display:none!important}
.hero{margin-bottom:16px}
.hero h1{font-size:30px;line-height:1.35;margin:0 0 8px}
.hero p{margin:0;color:var(--muted);line-height:1.7}
.record-card{
  margin-top:16px;padding:18px;border-radius:20px;background:#fbfaf8;border:1px solid var(--line);
}
.record-title{font-size:14px;font-weight:800;margin-bottom:12px}
.record-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.record-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.record-value{font-size:20px;font-weight:850;line-height:1.2}
.record-label{font-size:11px;color:var(--muted);margin-top:5px}
@media (max-width:520px){.record-grid{grid-template-columns:repeat(2,1fr)}}
.mode-grid{display:grid;gap:14px;margin-top:18px}
.mode{
  text-align:left;padding:20px;border-radius:20px;border:1px solid rgba(80,70,60,.10);
  box-shadow:0 5px 0 rgba(85,75,65,.10),0 9px 18px rgba(80,70,60,.05);
}
.mode strong{display:block;font-size:18px;margin-bottom:6px}
.mode span{font-size:13px;color:var(--muted);font-weight:500;line-height:1.5}
.mode.account{background:#eef2ed}
.mode.dc{background:#f1ece8}

.progress{height:8px;background:#ece7e1;border-radius:999px;overflow:hidden;margin-bottom:18px}
.bar{height:100%;background:var(--accent);width:0%;transition:.25s}
.kicker{font-size:13px;color:var(--muted);margin-bottom:6px}
.word{font-size:34px;font-weight:800;letter-spacing:.02em;margin:8px 0 8px}
.sub{font-size:14px;color:var(--muted);margin-bottom:18px;line-height:1.6}
.choices{display:grid;gap:10px}
button{
  width:100%;border:1px solid rgba(80,70,60,.10);color:var(--text);
  padding:16px 18px;border-radius:18px;font-size:16px;font-weight:750;cursor:pointer;
  box-shadow:0 5px 0 rgba(85,75,65,.12),0 9px 18px rgba(80,70,60,.06);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(85,75,65,.12),0 4px 10px rgba(80,70,60,.05)}
button:disabled{cursor:default}
.choice[data-cat="資産"]{background:var(--asset)}
.choice[data-cat="負債"]{background:var(--liability)}
.choice[data-cat="純資産"]{background:var(--equity)}
.choice[data-cat="収益"]{background:var(--revenue)}
.choice[data-cat="費用"]{background:var(--expense)}
.choice[data-side="借方"]{background:var(--debit)}
.choice[data-side="貸方"]{background:var(--credit)}
.choice.correct{outline:3px solid rgba(80,116,92,.28);filter:saturate(1.08)}
.choice.wrong{outline:3px solid rgba(154,98,98,.22);filter:grayscale(.18)}
.feedback{
  display:none;margin-top:16px;padding:14px;border-radius:14px;background:#f7f7f7;
  line-height:1.7;font-size:14px
}
.feedback.show{display:block}
.feedback.ok{background:#eef8f1}
.feedback.ng{background:#fff0f0}
.next{display:none;margin-top:14px;background:var(--accent);color:white;border:none}
.next.show{display:block}
.result{text-align:center;display:none}
.result.show{display:block}
.score{font-size:48px;font-weight:900;margin:8px 0}
.small{color:var(--muted);font-size:14px;line-height:1.6}
.actions{display:grid;gap:10px;margin-top:18px}
.secondary{background:#fff}
.back{
  width:auto;padding:9px 12px;border-radius:14px;background:#fff;font-size:13px;
  box-shadow:none;margin-bottom:14px
}
.record-link{
  margin-top:12px;background:#f2eee9;font-size:14px;
}
.quiz-settings{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:18px;background:#fbfaf8}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.setting-row + .setting-row{margin-top:12px}
.setting-label{font-size:13px;font-weight:800}
.pill-group{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.pill{width:auto;padding:8px 12px;border-radius:999px;background:#fff;box-shadow:none;font-size:12px}
.pill.active{background:#e3e8e0;border-color:#b9c3b5}

.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
.day-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.day-name{font-size:11px;color:var(--muted)}
.day-count{font-size:18px;font-weight:850;margin-top:4px}
.day-acc{font-size:10px;color:var(--muted);margin-top:3px}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.summary-box{background:#fbfaf8;border:1px solid var(--line);border-radius:16px;padding:14px}
.summary-label{font-size:11px;color:var(--muted)}
.summary-value{font-size:22px;font-weight:850;margin-top:4px}
.section-title{font-size:18px;font-weight:850;margin:4px 0 6px}
.section-note{font-size:13px;color:var(--muted);line-height:1.6}
.footer{margin-top:16px;text-align:center;color:var(--muted);font-size:12px}
@media (max-width:520px){.week-grid{grid-template-columns:repeat(7,1fr);gap:5px}.day-card{padding:8px 3px}.day-count{font-size:16px}}
@media (max-width:420px){.word{font-size:30px}.card{padding:18px}.hero h1{font-size:27px}}
</style>
  <meta name="theme-color" content="#9aafb3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ひとくち簿記">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">ひとくち簿記</div>
    <div class="badge" id="streak">今日 0セット</div>
  </div>

  <section id="home">
    <div class="card hero">
      <div class="kicker">今日はどれにする？</div>
      <h1>今日も、ひとくち。</h1>
      <p>ごはん食べながら、電車に乗りながら、<br>ちょっとだけ簿記に触れるためのミニ問題集。</p>
      <div class="record-card">
        <div class="record-title">今日のきろく</div>
        <div class="record-grid">
          <div class="record-item">
            <div class="record-value" id="todayAnswers">0問</div>
            <div class="record-label">回答</div>
          </div>
          <div class="record-item">
            <div class="record-value" id="todayAccuracy">—</div>
            <div class="record-label">正解率</div>
          </div>
          <div class="record-item">
            <div class="record-value" id="streakDays">0日</div>
            <div class="record-label">連続</div>
          </div>
          <div class="record-item">
            <div class="record-value" id="totalAnswers">0問</div>
            <div class="record-label">累計</div>
          </div>
        </div>
      </div>
      <button class="record-link" id="openRecords">学習きろくを見る</button>
      <div class="quiz-settings">
        <div class="setting-row">
          <div class="setting-label">レベル</div>
          <div class="pill-group">
            <button class="pill active" data-level="basic">きほん</button>
            <button class="pill" data-level="standard">ちょいむず</button>
            <button class="pill" data-level="all">まぜる</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">問題数</div>
          <div class="pill-group">
            <button class="pill active" data-count="5">5問だけ</button>
            <button class="pill" data-count="10">10問やる</button>
          </div>
        </div>
      </div>
      <div class="mode-grid">
        <button class="mode account" id="translateMode" style="background:#e8e4dc">
          <strong>ことば → 勘定科目</strong>
          <span>取引のことばを、簿記の勘定科目に変換する練習</span>
        </button>
        <button class="mode dc" id="positionMode" style="background:#e2e8e5">
          <strong>B/S・P/Lの位置</strong>
          <span>資産・負債・純資産・収益・費用が、どこにあるか覚える</span>
        </button>
        <button class="mode account" id="accountMode">
          <strong>勘定科目クイズ</strong>
          <span>資産・負債・純資産・収益・費用にグループ分け</span>
        </button>
        <button class="mode dc" id="dcMode">
          <strong>借方・貸方クイズ</strong>
          <span>勘定科目が増えたとき、どちら側に入るかを当てる</span>
        </button>
        <button class="mode journal" id="journalMode" style="background:var(--journal)">
          <strong>仕訳クイズ</strong>
          <span>取引を読んで、正しい仕訳を4つの中から選ぶ</span>
        </button>
        <button class="mode weak" id="weakMode" style="background:var(--weak)">
          <strong>苦手克服 <small id="weakCount" style="font-size:12px;font-weight:600"></small></strong>
          <span id="weakDesc">まちがえた問題を、できるまで。</span>
        </button>
      </div>
    </div>
  </section>


  <section id="recordsSection" class="hidden">
    <button class="back" id="recordsBack">← トップへ戻る</button>
    <div class="card">
      <div class="kicker">学習きろく</div>
      <div class="section-title">今週のきろく</div>
      <div class="section-note">1日ごとの回答数と正解率をまとめて見られます。</div>
      <div class="week-grid" id="weekGrid"></div>

      <div class="summary-grid">
        <div class="summary-box">
          <div class="summary-label">今週の回答</div>
          <div class="summary-value" id="weekAnswers">0問</div>
        </div>
        <div class="summary-box">
          <div class="summary-label">今週の正解率</div>
          <div class="summary-value" id="weekAccuracy">—</div>
        </div>
        <div class="summary-box">
          <div class="summary-label">いちばん解いた日</div>
          <div class="summary-value" id="bestDay">—</div>
        </div>
        <div class="summary-box">
          <div class="summary-label">苦手問題</div>
          <div class="summary-value" id="recordWeakCount">0問</div>
        </div>
      </div>

      <div class="summary-grid" style="margin-top:18px">
        <div class="summary-box">
          <div class="summary-label">連続学習</div>
          <div class="summary-value" id="recordStreak">0日</div>
        </div>
        <div class="summary-box">
          <div class="summary-label">累計回答</div>
          <div class="summary-value" id="recordTotal">0問</div>
        </div>
      </div>
    </div>
  </section>

  <section id="quizSection" class="hidden">
    <button class="back" id="backHome">← モードを選び直す</button>
    <div class="card" id="quizCard">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="kicker" id="modeLabel">勘定科目クイズ</div>
      <div class="kicker" id="count">1 / 5</div>
      <div class="word" id="word">現金</div>
      <div class="sub" id="sub">この勘定科目はどのグループ？</div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next" id="nextBtn">次の問題へ</button>
    </div>

    <div class="card result" id="resultCard">
      <div class="kicker">今回の結果</div>
      <div class="score" id="score">5 / 5</div>
      <div id="message">いい感じ！</div>
      <div class="small" id="missed"></div>
      <div class="actions">
        <button id="retryMissed">まちがえた問題だけ</button>
        <button class="secondary" id="restart">もう5問やる</button>
        <button class="secondary" id="resultHome">モード選択へ</button>
      </div>
    </div>
  </section>

  <div class="footer">やる気も『ひとくち』から。</div>
</div>

<script>

let mode="account", quiz=[], index=0, correct=0, missed=[], locked=false;

function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }

function problemKey(q, sourceMode){
  return sourceMode + "::" + q.word;
}

function loadWeak(){
  try { return JSON.parse(localStorage.getItem("boki_weak") || "{}"); }
  catch(e){ return {}; }
}

function saveWeak(data){
  localStorage.setItem("boki_weak", JSON.stringify(data));
}

function registerWeak(q, sourceMode){
  const data=loadWeak(), key=problemKey(q, sourceMode);
  if(!data[key]) data[key]={mode:sourceMode, word:q.word, correctStreak:0};
  data[key].correctStreak=0;
  saveWeak(data);
}

function markWeakCorrect(q, sourceMode){
  const data=loadWeak(), key=problemKey(q, sourceMode);
  if(!data[key]) return false;
  data[key].correctStreak=(data[key].correctStreak||0)+1;
  const mastered=data[key].correctStreak>=2;
  if(mastered) delete data[key];
  saveWeak(data);
  return mastered;
}

function allItemsWithMode(){
  return [
    ...TRANSLATE_ITEMS.map(q=>({q, sourceMode:"translate"})),
    ...POSITION_ITEMS.map(q=>({q, sourceMode:"position"})),
    ...ACCOUNT_ITEMS.map(q=>({q, sourceMode:"account"})),
    ...DC_ITEMS.map(q=>({q, sourceMode:"dc"})),
    ...JOURNAL_ITEMS.map(q=>({q, sourceMode:"journal"}))
  ];
}

function weakItems(){
  const data=loadWeak();
  const all=allItemsWithMode();
  return Object.values(data).map(w=>{
    const found=all.find(x=>x.sourceMode===w.mode && x.q.word===w.word);
    return found ? {...found.q, _sourceMode:w.mode} : null;
  }).filter(Boolean);
}

function updateWeakCount(){
  const n=weakItems().length;
  document.getElementById("weakCount").textContent=n ? `・${n}問` : "";
  document.getElementById("weakDesc").textContent=n ? "まちがえた問題を、できるまで。" : "苦手なし！いい感じ◎";
}

function localDateKey(date=new Date()){
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,"0");
  const d=String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

  localStorage.setItem("boki_study_stats", JSON.stringify(data));
}

function recordAnswer(isCorrect){
  const stats=loadStudyStats();
  const key=localDateKey();
  if(!stats.days[key]) stats.days[key]={answers:0, correct:0};
  stats.days[key].answers++;
  if(isCorrect) stats.days[key].correct++;
  stats.totalAnswers=(stats.totalAnswers||0)+1;
  if(isCorrect) stats.totalCorrect=(stats.totalCorrect||0)+1;
  saveStudyStats(stats);
}

function getStudyStreak(stats){
  let streak=0;
  let cursor=new Date();
  while(true){
    const key=localDateKey(cursor);
    if(stats.days[key] && stats.days[key].answers>0){
      streak++;
      cursor.setDate(cursor.getDate()-1);
    }else{
      break;
    }
  }
  return streak;
}

function updateStudyRecord(){
  const stats=loadStudyStats();
  const today=stats.days[localDateKey()] || {answers:0,correct:0};
  const accuracy=today.answers ? Math.round((today.correct/today.answers)*100)+"%" : "—";
  document.getElementById("todayAnswers").textContent=today.answers+"問";
  document.getElementById("todayAccuracy").textContent=accuracy;
  document.getElementById("streakDays").textContent=getStudyStreak(stats)+"日";
  document.getElementById("totalAnswers").textContent=(stats.totalAnswers||0)+"問";
}

function startOfWeek(date=new Date()){
  const d=new Date(date);
  const day=d.getDay(); // 0 Sun
  const diff=(day+6)%7; // Monday start
  d.setDate(d.getDate()-diff);
  d.setHours(0,0,0,0);
  return d;
}

function renderRecords(){
  const stats=loadStudyStats();
  const grid=document.getElementById("weekGrid");
  grid.innerHTML="";
  const names=["月","火","水","木","金","土","日"];
  const start=startOfWeek();
  let weekAnswers=0, weekCorrect=0, best={name:"—", answers:0};

  for(let i=0;i<7;i++){
    const d=new Date(start);
    d.setDate(start.getDate()+i);
    const key=localDateKey(d);
    const day=stats.days[key] || {answers:0,correct:0};
    weekAnswers+=day.answers;
    weekCorrect+=day.correct;
    if(day.answers>best.answers) best={name:names[i]+"曜", answers:day.answers};

    const el=document.createElement("div");
    el.className="day-card";
    el.innerHTML=`
      <div class="day-name">${names[i]}</div>
      <div class="day-count">${day.answers}</div>
      <div class="day-acc">${day.answers ? Math.round(day.correct/day.answers*100)+"%" : "—"}</div>
    `;
    grid.appendChild(el);
  }

  document.getElementById("weekAnswers").textContent=weekAnswers+"問";
  document.getElementById("weekAccuracy").textContent=weekAnswers ? Math.round(weekCorrect/weekAnswers*100)+"%" : "—";
  document.getElementById("bestDay").textContent=best.answers ? best.name : "—";
  document.getElementById("recordWeakCount").textContent=weakItems().length+"問";
  document.getElementById("recordStreak").textContent=getStudyStreak(stats)+"日";
  document.getElementById("recordTotal").textContent=(stats.totalAnswers||0)+"問";
}

function showRecords(){
  renderRecords();
  document.getElementById("home").classList.add("hidden");
  document.getElementById("quizSection").classList.add("hidden");
  document.getElementById("recordsSection").classList.remove("hidden");
}

function showHome(){
  updateWeakCount();
  updateStudyRecord();
  document.getElementById("recordsSection").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("quizSection").classList.add("hidden");
}

let selectedLevel="basic";
let selectedCount=5;

function levelItems(items){
  if(selectedLevel==="all") return items;
  return items.filter(q => selectedLevel==="basic" ? !q.level || q.level==="basic" : q.level==="standard");
}

function startMode(nextMode, source=null){
  mode=nextMode;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("quizSection").classList.remove("hidden");
  let items;
  if(source) items=source;
  else if(mode==="translate") items=TRANSLATE_ITEMS;
  else if(mode==="position") items=POSITION_ITEMS;
  else if(mode==="account") items=levelItems(ACCOUNT_ITEMS);
  else if(mode==="dc") items=levelItems(DC_ITEMS);
  else if(mode==="journal") items=levelItems(JOURNAL_ITEMS);
  else items=weakItems();

  if(mode==="weak" && items.length===0){
    showHome();
    alert("いまは苦手問題なし！いい感じ◎");
    return;
  }
  quiz = shuffle(items).slice(0, Math.min(mode==="weak" ? 5 : selectedCount, items.length));
  index=0; correct=0; missed=[]; locked=false;
  document.getElementById("quizCard").style.display="block";
  document.getElementById("resultCard").classList.remove("show");
  render();
}

function render(){
  const q=quiz[index];
  document.getElementById("count").textContent=`${index+1} / ${quiz.length}`;
  document.getElementById("bar").style.width=`${(index/quiz.length)*100}%`;
  const activeMode = mode==="weak" ? q._sourceMode : mode;
  document.getElementById("modeLabel").textContent = mode==="weak" ? "苦手克服" : activeMode==="translate" ? "ことば → 勘定科目" : activeMode==="position" ? "B/S・P/Lの位置" : activeMode==="account" ? "勘定科目クイズ" : activeMode==="dc" ? "借方・貸方クイズ" : "仕訳クイズ";
  document.getElementById("word").textContent=q.word;
  document.getElementById("sub").textContent = activeMode==="translate"
    ? "このことばは、どの勘定科目？"
    : activeMode==="position"
      ? "これはどこにある？"
      : activeMode==="account"
        ? "この勘定科目はどのグループ？"
        : activeMode==="dc"
          ? "この変化は、借方・貸方どちら側？"
          : "正しい仕訳はどれ？";

  const box=document.getElementById("choices");
  box.innerHTML="";
  const options = activeMode==="account" ? CATEGORIES : activeMode==="dc" ? ["借方","貸方"] : (activeMode==="translate" || activeMode==="position") ? shuffle(q.options) : shuffle(q.options);

  options.forEach(opt=>{
    const b=document.createElement("button");
    b.className="choice";
    if(activeMode==="account") b.dataset.cat=opt;
    else if(activeMode==="dc") b.dataset.side=opt;
    else b.style.background="#f3f0ec";
    b.textContent=opt;
    b.onclick=()=>answer(opt,b);
    box.appendChild(b);
  });

  const feedback=document.getElementById("feedback");
  feedback.className="feedback";
  feedback.textContent="";
  document.getElementById("nextBtn").classList.remove("show");
  locked=false;
}

function answer(choice, btn){
  if(locked) return;
  locked=true;
  const q=quiz[index];
  const activeMode = mode==="weak" ? q._sourceMode : mode;
  const correctAnswer = activeMode==="account" ? q.cat : activeMode==="dc" ? q.side : q.answer;
  const buttons=[...document.querySelectorAll(".choice")];
  buttons.forEach(b=>{
    b.disabled=true;
    if(b.textContent===correctAnswer) b.classList.add("correct");
  });

  const fb=document.getElementById("feedback");
  recordAnswer(choice===correctAnswer);
  if(choice===correctAnswer){
    correct++;
    let mastered=false;
    if(mode==="weak") mastered=markWeakCorrect(q, activeMode);
    fb.className="feedback show ok";
    fb.innerHTML=`⭕ 正解！<br>${q.ex}${mode==="weak" ? (mastered ? "<br><strong>🎉 2回正解！この問題は克服！</strong>" : "<br>あと1回正解で克服！") : ""}`;
  }else{
    btn.classList.add("wrong");
    missed.push(q);
    registerWeak(q, activeMode);
    fb.className="feedback show ng";
    fb.innerHTML=`❌ 正解は「${correctAnswer}」<br>${q.ex}<br><strong>苦手克服に追加したよ</strong>`;
  }

  document.getElementById("nextBtn").classList.add("show");
  document.getElementById("bar").style.width=`${((index+1)/quiz.length)*100}%`;
}

document.getElementById("nextBtn").onclick=()=>{
  index++;
  if(index<quiz.length) render();
  else finish();
};

function finish(){
  document.getElementById("quizCard").style.display="none";
  const rc=document.getElementById("resultCard");
  rc.classList.add("show");
  document.getElementById("score").textContent=`${correct} / ${quiz.length}`;
  let msg = correct===quiz.length ? "満点！その調子👏" :
            correct>=4 ? "かなりいい感じ！" :
            correct>=3 ? "あと一歩。もう1セットで定着しそう。" :
            "ここから覚えればOK。5問だけ続けよ。";
  document.getElementById("message").textContent=msg;
  document.getElementById("missed").textContent=
    missed.length ? `今回の復習：${missed.map(x=>x.word).join("・")}` : "まちがいなし！";

  const key="boki_sets_"+localDateKey();
  const n=(+localStorage.getItem(key)||0)+1;
  localStorage.setItem(key,n);
  updateStreak();
  updateStudyRecord();
  document.getElementById("retryMissed").style.display=missed.length ? "block":"none";
}

function updateStreak(){
  const key="boki_sets_"+localDateKey();
  const n=+localStorage.getItem(key)||0;
  document.getElementById("streak").textContent=`今日 ${n}セット`;
}


document.querySelectorAll("[data-level]").forEach(btn=>{
  btn.onclick=()=>{
    selectedLevel=btn.dataset.level;
    document.querySelectorAll("[data-level]").forEach(x=>x.classList.toggle("active",x===btn));
  };
});
document.querySelectorAll("[data-count]").forEach(btn=>{
  btn.onclick=()=>{
    selectedCount=Number(btn.dataset.count);
    document.querySelectorAll("[data-count]").forEach(x=>x.classList.toggle("active",x===btn));
  };
});

document.getElementById("openRecords").onclick=showRecords;
document.getElementById("recordsBack").onclick=showHome;
document.getElementById("translateMode").onclick=()=>startMode("translate");
document.getElementById("positionMode").onclick=()=>startMode("position");
document.getElementById("accountMode").onclick=()=>startMode("account");
document.getElementById("dcMode").onclick=()=>startMode("dc");
document.getElementById("journalMode").onclick=()=>startMode("journal");
document.getElementById("weakMode").onclick=()=>startMode("weak");
document.getElementById("backHome").onclick=showHome;
document.getElementById("resultHome").onclick=showHome;
document.getElementById("restart").onclick=()=>startMode(mode);
document.getElementById("retryMissed").onclick=()=>startMode(mode, missed);

updateStreak();
updateWeakCount();
updateStudyRecord();
showHome();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
}
</script>
</body>
</html>
